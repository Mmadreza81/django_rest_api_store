version: "3.9"

services:

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: celery_worker
    working_dir: /app
    command: >
      python -m celery -A A worker --pool=solo --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis

  celery_beat:
    build: .
    container_name: celery_beat
    working_dir: /app
    command: >
      python -m celery -A A beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers.DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      - redis